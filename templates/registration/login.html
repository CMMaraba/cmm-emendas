{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-4">Acesso ao sistema</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha inválidos.</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-marrom">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
