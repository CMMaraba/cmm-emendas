# /etc/nginx/sites-available/cmm-emendas — ativar com:
#   ln -s /etc/nginx/sites-available/cmm-emendas /etc/nginx/sites-enabled/cmm-emendas
#
# Ocupa a porta 8000 do host, a mesma que o container project_web_1 usava antes do
# cutover — assim a regra de proxy do Apache em 10.3.150.20 não precisa mudar de destino.

server {
    listen 0.0.0.0:8000;
    server_name _;

    client_max_body_size 25M;

    access_log /var/log/nginx/cmm-emendas.access.log;
    error_log  /var/log/nginx/cmm-emendas.error.log;

    location /emendas/static/ {
        alias /var/lib/cmm-emendas/static/;
    }

    location /emendas/media/ {
        alias /var/lib/cmm-emendas/media/;
    }

    location / {
        proxy_pass http://unix:/run/cmm-emendas/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto vem do Apache em 10.3.150.20, que termina o TLS — ver
        # deploy/apache-10.3.150.20.snippet.conf. Não sobrescrever aqui.
    }
}
