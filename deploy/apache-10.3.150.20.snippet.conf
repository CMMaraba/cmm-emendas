# Trecho a inserir em /etc/apache2/sites-enabled/000-portalmodelo3.conf, dentro do
# <VirtualHost *:443>, imediatamente ACIMA do bloco "#emendas app" existente
# (por volta da linha 37). Requer `a2enmod headers` (checar com `apache2ctl -M | grep headers`).
#
# Sem isso, com SECURE_PROXY_SSL_HEADER e cookies seguros ativos no Django, as
# requisições são tratadas como HTTP e o login entra em loop de redirecionamento.

<If "%{REQUEST_URI} =~ m#^/emendas#">
    RequestHeader set X-Forwarded-Proto "https"
</If>

# Bloco já existente, mantido como está:
#   RewriteCond %{REQUEST_URI} ^/emendas.*$
#   RewriteRule ^(.*)$ http://10.3.150.7:8000$1 [P,L]
